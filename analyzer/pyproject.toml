[project]
name = "liveness-analyzer"
version = "0.1.0"
description = "Análisis de frames para liveness detection: visión por computador y procesamiento de señal. Sólo mide, nunca decide."
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "nats-py>=2.9.0",                 # bus NATS core
    "numpy>=2.0.0",                   # álgebra y señal
    "opencv-python-headless>=4.10.0", # decodificación JPEG y métricas de calidad
    # MediaPipe 1.0.x aborta el proceso en macOS ARM: el grafo inicializa
    # Metal incondicionalmente (TensorsToDetectionsCalculator) y muere con
    # SIGABRT, sin excepción que capturar. La línea 0.10.x funciona.
    "mediapipe>=0.10.30,<1.0",        # Face Landmarker
    "onnxruntime>=1.19.0",            # inferencia en CPU de modelos ONNX
    "prometheus-client>=0.21.0",      # exposición de métricas
    "protobuf>=5.28.0",               # contratos del bus (/proto)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
liveness-analyzer = "analyzer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "T20"]  # T20 prohíbe print
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "T20", "B011"]

[tool.mypy]
python_version = "3.12"
packages = ["analyzer"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
pythonpath = ["src"]
