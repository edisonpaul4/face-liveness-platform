# Infraestructura local de la plataforma de liveness.
#
#   make up    levanta todo
#   make down  lo baja
#
# NATS va en modo CORE (sin JetStream) a propósito: el camino de frames es
# efímero. Ver CLAUDE.md §4.

name: liveness

services:
  nats:
    image: nats:2.10-alpine
    container_name: liveness-nats
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./deploy/nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "${NATS_PORT:-4222}:4222"   # cliente
      - "${NATS_MONITOR_PORT:-8222}:8222"   # monitorización
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: liveness-redis
    # Estado caliente y efímero: sin persistencia en disco, política LRU.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: liveness-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liveness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liveness}
      POSTGRES_DB: ${POSTGRES_DB:-liveness}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liveness} -d ${POSTGRES_DB:-liveness}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: liveness-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Job de un solo uso: crea los buckets de evidencia y sale.
  minio-init:
    image: minio/mc:latest
    container_name: liveness-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/create-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./deploy/minio/create-buckets.sh:/init/create-buckets.sh:ro
    restart: "no"

volumes:
  postgres-data:
  minio-data:
