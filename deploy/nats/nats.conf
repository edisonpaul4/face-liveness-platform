# NATS core para el camino de frames.
#
# SIN JetStream a propósito (CLAUDE.md §4): el bus es efímero. Un frame
# perdido se pierde; reintentarlo llega tarde y rompe la continuidad temporal.
# Si alguien añade `jetstream {}` aquí, está cambiando la arquitectura.

port: 4222
http_port: 8222

server_name: liveness-nats-1

# Los frames son mensajes grandes: hasta ~1 MB por frame codificado.
max_payload: 2MB

# Cola de salida por cliente lento: se prefiere descartar a acumular latencia.
write_deadline: "2s"

max_connections: 4096
max_control_line: 4KB

debug: false
trace: false
logtime: true
